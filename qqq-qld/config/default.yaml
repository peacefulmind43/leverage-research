data:
  tickers: [QQQ, QLD]
  source: "hybrid"
  start: "2006-06-19"
  end: null
  cache: "work/prices.csv"

portfolio:
  rebalance: "ME"
  transaction_cost_bps: 2.0
  initial_value: 10000.0

optimization:
  grid_step: 0.01
  annual_risk_free_rate: 0.0
  target_volatility: 0.25
  max_drawdown_limit: -0.60
  min_train_years: 5
  test_years: 1
  walk_forward_objective: "sharpe"
  bootstrap_samples: 1000
  bootstrap_block_days: 21
  seed: 42
  # Illustrative, user-editable forward-looking excess-return assumptions for the
  # Kelly sensitivity table (see docs/methodology.md section 6.2). These are NOT
  # this tool's own forecast -- they are inputs you should replace with your own
  # view. The trailing-sample estimate is added automatically alongside these.
  mu_scenarios:
    "Conservative (valuation-anchored ~10y CMA, e.g. Vanguard/Research Affiliates)": 0.06
    "Bear case (GMO-style multiple reversion)": -0.04
    "Bull case (AI upside exceeds current consensus)": 0.12

report:
  results_dir: "results"
  assets_dir: "assets"
